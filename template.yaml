AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StockPlay Backend API

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Runtime: python3.12
    Environment:
      Variables:
        PYTHONPATH: /var/task

Resources:
  # 기존 API Lambda
  StockPlayAPI:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stockplay-api
      Handler: lambda_handler.handler
      CodeUri: .
      Description: StockPlay FastAPI Backend
      Environment:
        Variables:
          PYTHONPATH: /var/task
          USE_S3_DATA: "true"
          S3_DATA_BUCKET: "stockplay-data-yjw-20251113"
          DYNAMODB_TABLE: "stockplay-main"
          DEBUG: "false"
      Policies:
        - S3ReadPolicy:
            BucketName: stockplay-data-yjw-20251113
        - S3CrudPolicy:
            BucketName: stockplay-reports-yjw-20251113
        - DynamoDBCrudPolicy:
            TableName: stockplay-main
        - SESCrudPolicy:
            IdentityName: "*"
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

  # 이메일 발송 Lambda
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stockplay-email-sender
      Handler: email_sender.lambda_handler
      CodeUri: .
      Description: StockPlay Email Sender (Daily Report)
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_TABLE: "stockplay-main"
          SES_FROM_EMAIL: "yyyyjw@naver.com"
          S3_REPORT_BUCKET: "stockplay-reports-yjw-20251113"
          API_URL: "https://rwcdhytnni.execute-api.ap-northeast-2.amazonaws.com/Prod/api"
      Policies:
        - DynamoDBReadPolicy:
            TableName: stockplay-main
        - SESCrudPolicy:
            IdentityName: "*"
        - S3ReadPolicy:
            BucketName: stockplay-reports-yjw-20251113
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Description: Send daily report at 9 AM KST (midnight UTC)
            Enabled: true

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt StockPlayAPI.Arn

  EmailSenderArn:
    Description: "Email Sender Lambda ARN"
    Value: !GetAtt EmailSenderFunction.Arn
