<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <dir>/var/task/fonts</dir>
  <cachedir>/tmp/fontconfig-cache</cachedir>

  <!-- NanumGothic Regular -->
  <match target="pattern">
    <test name="family"><string>NanumGothic</string></test>
    <test name="weight" compare="less"><const>bold</const></test>
    <edit name="file" mode="assign"><string>/var/task/fonts/NanumGothic-Regular.ttf</string></edit>
  </match>

  <!-- NanumGothic Bold -->
  <match target="pattern">
    <test name="family"><string>NanumGothic</string></test>
    <test name="weight" compare="more_eq"><const>bold</const></test>
    <edit name="file" mode="assign"><string>/var/task/fonts/NanumGothic-Bold.ttf</string></edit>
  </match>

  <!-- Default sans-serif fallback to NanumGothic -->
  <alias>
    <family>sans-serif</family>
    <prefer><family>NanumGothic</family></prefer>
  </alias>
</fontconfig>
