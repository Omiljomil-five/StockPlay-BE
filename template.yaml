AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StockPlay Backend API

Globals:
  Function:
    Timeout: 30
    MemorySize: 1024
    Environment:
      Variables:
        PYTHONPATH: /var/task
  Api:
    BinaryMediaTypes:
      - "*/*"

Resources:
  # 메인 API Lambda (Docker — WeasyPrint pango/cairo 의존성)
  StockPlayAPI:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      Description: StockPlay FastAPI Backend
      Environment:
        Variables:
          PYTHONPATH: /var/task
          USE_S3_DATA: "true"
          S3_DATA_BUCKET: "stockplay-data-yjw-20251113"
          DYNAMODB_TABLE: "stockplay-main"
          SES_FROM_EMAIL: "yyyyjw@naver.com"
          DEBUG: "false"
          FONTCONFIG_FILE: "/var/task/fonts/fonts.conf"
      Policies:
        - S3ReadPolicy:
            BucketName: stockplay-data-yjw-20251113
        - S3CrudPolicy:
            BucketName: stockplay-reports-yjw-20251113
        - DynamoDBCrudPolicy:
            TableName: stockplay-main
        - SESCrudPolicy:
            IdentityName: "*"
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
    Metadata:
      DockerTag: latest
      DockerContext: .
      Dockerfile: Dockerfile

  # 이메일 발송 Lambda
  EmailSenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stockplay-email-sender
      Runtime: python3.12
      Handler: email_sender.lambda_handler
      CodeUri: .
      Description: StockPlay Email Sender (Daily Report)
      Timeout: 60
      Environment:
        Variables:
          DYNAMODB_TABLE: "stockplay-main"
          SES_FROM_EMAIL: "yyyyjw@naver.com"
          S3_REPORT_BUCKET: "stockplay-reports-yjw-20251113"
          API_URL: "https://4alrpz1t36.execute-api.ap-northeast-2.amazonaws.com/Prod/api"
      Policies:
        - DynamoDBReadPolicy:
            TableName: stockplay-main
        - SESCrudPolicy:
            IdentityName: "*"
        - S3ReadPolicy:
            BucketName: stockplay-reports-yjw-20251113
      Events:
        DailySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 0 * * ? *)
            Description: Send daily report at 9 AM KST (midnight UTC)
            Enabled: true

  # 월간 데이터 자동 갱신 Lambda (Docker)
  DataUpdaterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stockplay-data-updater
      PackageType: Image
      Timeout: 900
      MemorySize: 2048
      Environment:
        Variables:
          S3_DATA_BUCKET: "stockplay-data-yjw-20251113"
          CUSTOMS_API_KEY: "fqJry%2BXMzG3OfIzPup5MZNOTmNCbr3lY%2FzkZ%2FEJQ61zuEvZPCrTG3YRsWxhOQTsrSWA8fydBszKR04ecBbknmg%3D%3D"
      Policies:
        - S3CrudPolicy:
            BucketName: stockplay-data-yjw-20251113
      Events:
        MonthlySchedule:
          Type: Schedule
          Properties:
            Schedule: cron(0 3 20 * ? *)
            Description: Monthly data update at 12:00 KST (03:00 UTC) on 20th
            Enabled: true
    Metadata:
      DockerTag: latest
      DockerContext: ./data_updater
      Dockerfile: Dockerfile

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt StockPlayAPI.Arn

  EmailSenderArn:
    Description: "Email Sender Lambda ARN"
    Value: !GetAtt EmailSenderFunction.Arn

  DataUpdaterArn:
    Description: "Data Updater Lambda ARN"
    Value: !GetAtt DataUpdaterFunction.Arn
