AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: StockPlay Backend API

Globals:
  Function:
    Timeout: 30
    MemorySize: 512
    Runtime: python3.12
    Environment:
      Variables:
        PYTHONPATH: /var/task

Resources:
  StockPlayAPI:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: stockplay-api
      Handler: lambda_handler.handler
      CodeUri: .
      Description: StockPlay FastAPI Backend
      Environment:
        Variables:
          PYTHONPATH: /var/task
          USE_S3_DATA: "true"
          S3_DATA_BUCKET: "stockplay-data-yjw-20251113"
          DEBUG: "false"
      Policies:
        - S3ReadPolicy:
            BucketName: stockplay-data-yjw-20251113
        - S3CrudPolicy:
            BucketName: stockplay-reports-yjw-20251113
      Events:
        ApiRoot:
          Type: Api
          Properties:
            Path: /
            Method: ANY
        ApiProxy:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY

Outputs:
  ApiEndpoint:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  FunctionArn:
    Description: "Lambda Function ARN"
    Value: !GetAtt StockPlayAPI.Arn
